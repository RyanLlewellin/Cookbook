name: Validate, migrate and publish Cookbook

on:
  push:
    branches: [main]
    paths:
      - ".github/skills/recipe-processor/**"
      - ".github/workflows/cookbook.yml"
      - "data/recipes.json"
      - "scripts/**"
      - "templates/**"
      - "assets/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "cookbook-pages"
  cancel-in-progress: false

jobs:
  cookbook:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Cookbook
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate existing recipes safely
        run: python scripts/migrate.py --write

      - name: Test recipe schema and page rendering
        run: python -m unittest discover -s tests -v

      - name: Rebuild every recipe page
        run: python scripts/build.py

      - name: Package public static site
        run: python scripts/package.py

      - name: Save normalized data and generated recipe pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Cookbook recipe pages [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
