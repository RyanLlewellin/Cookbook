<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title>Grocery List | Cyan’s Cookbook</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#242c26;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.shell{max-width:1050px;margin:auto;padding:0 24px}header{background:#fffdf8;border-bottom:1px solid #e2e1d9}.cyan-nav{display:grid!important;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding-top:19px;padding-bottom:19px}.cyan-nav a{text-decoration:none}.cyan-back{justify-self:start;display:inline-flex;align-items:center;gap:8px;color:#294e3b;font-size:.91rem;font-weight:650;white-space:nowrap}.cyan-title{justify-self:center;font-family:Georgia,serif;font-size:clamp(1.1rem,3vw,1.55rem);font-weight:700;white-space:nowrap;color:#242c26}.cyan-cart{justify-self:end;display:inline-flex;align-items:center;gap:5px;background:#e7ede3;border:1px solid #cbd9ca;border-radius:999px;padding:9px 12px;color:#294e3b;font-weight:650;font-size:.85rem;white-space:nowrap}@media(max-width:560px){.cyan-nav{gap:5px}.back-label,.cart-label{display:none}.cyan-back{font-size:1.7rem}.cyan-cart{padding:9px 11px}.cyan-title{font-size:1.22rem}}main{padding-top:46px;padding-bottom:90px}.eyebrow{font-size:.76rem;color:#9b6548;text-transform:uppercase;letter-spacing:.14em;font-weight:800}h1{font:500 clamp(2.6rem,7vw,4.4rem) Georgia,serif;margin:14px 0}.lead,.muted{color:#65736a;line-height:1.6}.panel{margin:28px 0;background:white;border:1px solid #e2e1d9;border-radius:18px;padding:26px}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{background:#e7ede3;color:#294e3b;border:1px solid #cbd9ca;border-radius:10px;padding:11px 14px;font-weight:650}.danger{background:#fff3ef;border-color:#eed2c8;color:#a64b33}.item{display:flex;gap:14px;align-items:flex-start;padding:17px 0;border-bottom:1px solid #e5e8e1}.item:last-child{border:0}.item input{height:23px;width:23px;accent-color:#294e3b;flex:none;margin:2px 0}.item label{flex:1;cursor:pointer;min-width:0}.item strong{font-size:1.06rem}.item small{display:block;margin-top:5px;color:#69766e;line-height:1.5}.item.checked strong{text-decoration:line-through;color:#89968d}.empty{padding:44px 20px;text-align:center;color:#68746c;border:1px dashed #cbd5ca;border-radius:16px}.empty a{font-weight:700;color:#294e3b;text-decoration:underline}.count{font-size:.9rem;color:#65736a;margin:15px 0}.meals{color:#65736a;font-size:.9rem;margin:8px 0 0}@media(max-width:550px){main{padding-top:30px}.panel{padding:18px}}
.swipe-wrap{position:relative;overflow:hidden;border-bottom:1px solid #e5e8e1;touch-action:pan-y}.swipe-wrap:last-child{border-bottom:0}.item{position:relative;z-index:1;background:white;border-bottom:0;align-items:center;transition:transform .18s ease;touch-action:pan-y}.item.swiped{transform:translateX(-88px)}.item label{display:block}.quantity{display:block;font-size:.9rem;font-weight:700;color:#294e3b;margin-top:4px}.item.checked .quantity{text-decoration:line-through;color:#89968d}.item-delete{position:absolute;right:0;top:0;bottom:0;width:88px;background:#b84a36;border:0;color:white;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}.desktop-delete{align-self:center;border:0;background:transparent;color:#a64b33;padding:9px;font-size:1.25rem;border-radius:8px}.desktop-delete:focus-visible,.item-delete:focus-visible{outline:3px solid #222;outline-offset:-3px}@media(hover:none) and (pointer:coarse){.desktop-delete{display:none}}@media(hover:hover){.item-delete{display:none}.item.swiped{transform:none}}@media(prefers-reduced-motion:reduce){.item{transition:none}}</style></head><body>
<header><div class="shell cyan-nav"><a class="cyan-back" href="../" aria-label="Back to all recipes"><span aria-hidden="true">←</span><span class="back-label">All recipes</span></a><a class="cyan-title" href="../">Cyan’s Cookbook</a><a class="cyan-cart" href="../grocery/" aria-label="Open grocery list">🛒 <span class="cart-label">Grocery list</span></a></div></header>
<main class="shell"><span class="eyebrow">Shopping made simple</span><h1>Grocery list</h1><p class="lead">Everything you need for your selected recipes, organized into one checklist. Check off items as you shop. Swipe left on an item to reveal Delete, or use its trash button.</p>
<section class="panel" aria-label="Your grocery checklist"><div class="toolbar"><div id="summary" class="count" aria-live="polite"></div><div class="actions"><button type="button" class="btn" id="copy">Copy list</button><button type="button" class="btn danger" id="clear" aria-label="Clear all grocery items">🗑 Clear all</button></div></div><div id="items"></div><p id="meals" class="meals"></p></section>
<p class="muted"><a href="../pantry/" style="color:#294e3b;font-weight:700">← Add more meals from What Can I Make?</a></p></main>
<script>
(async()=>{
const slug=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const norm=s=>String(s).toLowerCase().trim().replace(/\([^)]*\)/g,'').replace(/^\s*[\d\s./¼½¾⅓⅔-]+\s*/,'').replace(/^(?:cups?|tbsp|tsp|tablespoons?|teaspoons?|grams?|g|oz|lbs?|cloves?|cans?|pieces?)\s+/,'').replace(/^(?:of\s+)/,'').trim();
const ingredientName=s=>norm(s).replace(/^.*?\b(?:of)\s+/,'').replace(/\s*,.*$/,'').trim();
const loadSet=key=>{try{const value=JSON.parse(localStorage.getItem(key)||'[]');return new Set(Array.isArray(value)?value:[])}catch{return new Set()}};
const recipeId=r=>slug(r.category||'recipe')+'/'+slug(r.slug||r.title);
const pantry=loadSet('cookbook-pantry'),planned=loadSet('cookbook-grocery-meals'),checked=loadSet('cookbook-grocery-checked'),deleted=loadSet('cookbook-grocery-deleted');
let recipes=[],details=[];
try{
const [summary,source]=await Promise.all([fetch('../recipes.json'),fetch('../data/recipes.json')]);
if(!summary.ok)throw Error();
recipes=await summary.json();
if(!Array.isArray(recipes))throw Error();
if(source.ok){const data=await source.json();if(Array.isArray(data))details=data}
}catch{document.querySelector('#items').textContent='Could not load recipes. Please refresh.';return}
const save=()=>{try{
localStorage.setItem('cookbook-grocery-meals',JSON.stringify([...planned]));
localStorage.setItem('cookbook-grocery-checked',JSON.stringify([...checked]));
localStorage.setItem('cookbook-grocery-deleted',JSON.stringify([...deleted]))
}catch{}};
const number=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
const quantityText=parts=>{
if(!parts.length)return 'Amount not specified';
const grouped=new Map();
for(const p of parts){
const unit=String(p.unit||'').toLowerCase().trim();
if(p.quantity==null||!Number.isFinite(Number(p.quantity))){const note=p.note||'Amount not specified';grouped.set('note:'+note,note);continue}
const quantity=Number(p.quantity),key='unit:'+unit;
grouped.set(key,(grouped.get(key)||0)+quantity)
}
return [...grouped].map(([key,value])=>key.startsWith('unit:')?number(value)+(key.slice(5)?' '+key.slice(5):''):value).join(' + ')
};
const build=()=>{
const meals=recipes.filter(r=>planned.has(recipeId(r))),map=new Map();
for(const r of meals){
const d=details.find(d=>recipeId(d)===recipeId(r));
const entries=d&&Array.isArray(d.ingredients)?d.ingredients:(r.ingredients||[]).map(name=>({name,quantity:null,unit:''}));
for(const entry of entries){
const name=ingredientName(typeof entry==='string'?entry:entry.name);
if(!name||pantry.has(name)||deleted.has(name))continue;
if(!map.has(name))map.set(name,{meals:new Set(),parts:[]});
const item=map.get(name);item.meals.add(r.title);
if(typeof entry==='object')item.parts.push({quantity:entry.quantity,unit:entry.unit,note:entry.note});
}
}
return {meals,lines:[...map].sort((a,b)=>a[0].localeCompare(b[0]))}
};
function removeItem(name){deleted.add(name);checked.delete(name);save();render()}
function render(){
const {meals,lines}=build(),container=document.querySelector('#items');container.replaceChildren();
document.querySelector('#summary').textContent=lines.length+' ingredients • '+meals.length+' meals • '+lines.filter(([name])=>checked.has(name)).length+' checked off';
document.querySelector('#meals').textContent=meals.length?'Meals: '+meals.map(r=>r.title).join(', '):'';
if(!lines.length){
const empty=document.createElement('div');empty.className='empty';
empty.textContent=meals.length?'No grocery items remaining.':'Your grocery list is empty. ';
if(!meals.length){const link=document.createElement('a');link.href='../pantry/';link.textContent='Find recipes to add.';empty.append(link)}
container.append(empty);return
}
lines.forEach(([name,info])=>{
const wrap=document.createElement('div');wrap.className='swipe-wrap';
const swipeDelete=document.createElement('button');swipeDelete.className='item-delete';swipeDelete.type='button';swipeDelete.textContent='🗑 Delete';swipeDelete.setAttribute('aria-label','Delete '+name);swipeDelete.onclick=()=>removeItem(name);
const row=document.createElement('div');row.className='item'+(checked.has(name)?' checked':'');
const cb=document.createElement('input');cb.type='checkbox';cb.id='item-'+slug(name);cb.checked=checked.has(name);cb.onchange=()=>{cb.checked?checked.add(name):checked.delete(name);save();render()};
const label=document.createElement('label');label.htmlFor=cb.id;
const strong=document.createElement('strong');strong.textContent=name;
const quantity=document.createElement('span');quantity.className='quantity';quantity.textContent=quantityText(info.parts);
const small=document.createElement('small');small.textContent='For: '+[...info.meals].join(', ');
label.append(strong,quantity,small);
const deleteBtn=document.createElement('button');deleteBtn.type='button';deleteBtn.className='desktop-delete';deleteBtn.textContent='🗑';deleteBtn.setAttribute('aria-label','Delete '+name);deleteBtn.onclick=()=>removeItem(name);
row.append(cb,label,deleteBtn);wrap.append(swipeDelete,row);container.append(wrap);
let startX=0,startY=0,tracking=false;
row.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;tracking=true},{passive:true});
row.addEventListener('touchend',e=>{if(!tracking||!e.changedTouches.length)return;tracking=false;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){container.querySelectorAll('.item.swiped').forEach(x=>{if(x!==row)x.classList.remove('swiped')});row.classList.toggle('swiped',dx<0)}
},{passive:true});
});
}
document.querySelector('#clear').onclick=()=>{
if(!planned.size&&!checked.size&&!deleted.size)return;
if(!confirm('Clear the entire grocery list and remove selected meals?'))return;
planned.clear();checked.clear();deleted.clear();save();render()
};
document.querySelector('#copy').onclick=async()=>{
const {lines}=build();if(!lines.length)return;
const content='Cyan’s Cookbook grocery list\n'+lines.map(([name,info])=>(checked.has(name)?'☑ ':'☐ ')+name+' — '+quantityText(info.parts)+' (for: '+[...info.meals].join(', ')+')').join('\n');
try{await navigator.clipboard.writeText(content);const btn=document.querySelector('#copy');btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy list',1800)}catch{alert('Unable to copy list.')}
};
window.addEventListener('storage',render);render();
})();
</script></body></html>
